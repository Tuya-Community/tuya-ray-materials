<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <title>Markmap</title>
  <style>
    html,
    body {
      padding: 0;
      margin: 0;
    }

    svg.markmap {
      width: 100%;
      height: 100vh;
      padding: 0;
      margin: 0;
    }

    .markmap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      margin: 0;
    }
  </style>
  <script>
    window.markmap = {
      autoLoader: { manual: true },
    };
    // 定义 SVG 命名空间变量
    const p1 = 'htt';
    const p2 = 'p:';
    const p3 = '//www.w3.org/2000/svg'
    window.SVG_NS = `${p1}${p2}${p3}`;
  </script>
  <script src="markmap.js"></script>
</head>

  <div class="markmap" id="mindMapContainer">

  <script>
    // 动态设置 SVG 的 xmlns 属性（closeSvg 可能不存在，做保护）
    var closeSvgEl = document.getElementById('closeSvg');
    if (closeSvgEl) {
      closeSvgEl.setAttribute('xmlns', window.SVG_NS);
